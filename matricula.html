<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Matrícula</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f7f7f7; padding:20px; }
        .container { max-width:800px; margin:0 auto; background:#fff; padding:20px; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
        h1 { margin-top:0 }
        form .row { display:flex; gap:12px; }
        .field { flex:1; display:flex; flex-direction:column; margin-bottom:12px }
        label { font-weight:600; margin-bottom:6px }
        input[type="text"], input[type="email"], input[type="date"], select, textarea { padding:8px; border:1px solid #ccc; border-radius:4px }
        textarea { resize:vertical }
        .actions { text-align:right; margin-top:16px }
        button { background:#0055a5; color:#fff; border:none; padding:10px 16px; border-radius:4px; cursor:pointer }
        .success { background:#e6ffed; border:1px solid #86d59f; padding:10px; border-radius:4px; margin-bottom:12px; color:#1b6b2f }
        @media (max-width:600px) { .row { flex-direction:column } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Formulario de Matrícula</h1>
        <p>Complete los datos del estudiante y del representante. Los campos marcados con * son obligatorios.</p>

        <div id="message" aria-live="polite" style="display:none"></div>

        <form id="matriculaForm">
            <fieldset style="border:none;padding:0;margin:0">
                <legend style="font-weight:700; margin-bottom:8px">Datos del estudiante</legend>

                <div class="row">
                    <div class="field">
                        <label for="nombre">Nombres *</label>
                        <input id="nombre" name="nombre" type="text" required maxlength="100">
                    </div>
                    <div class="field">
                        <label for="apellido">Apellidos *</label>
                        <input id="apellido" name="apellido" type="text" required maxlength="100">
                    </div>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="documento">Documento (DNI/RUC) *</label>
                        <input id="documento" name="documento" type="text" required maxlength="30">
                    </div>
                    <div class="field">
                        <label for="fecha_nac">Fecha de nacimiento *</label>
                        <input id="fecha_nac" name="fecha_nac" type="date" required>
                    </div>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="grado">Grado solicitado *</label>
                        <select id="grado" name="grado" required>
                            <option value="">-- Seleccione --</option>
                            <option>Inicial</option>
                            <option>1°</option>
                            <option>2°</option>
                            <option>3°</option>
                            <option>4°</option>
                            <option>5°</option>
                            <option>6°</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="sexo">Sexo</label>
                        <select id="sexo" name="sexo">
                            <option value="">-- --</option>
                            <option>Femenino</option>
                            <option>Masculino</option>
                            <option>Otro</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="direccion">Dirección</label>
                    <textarea id="direccion" name="direccion" rows="2"></textarea>
                </div>

                <div class="field">
                    <label for="escuela_anterior">Escuela anterior</label>
                    <input id="escuela_anterior" name="escuela_anterior" type="text" maxlength="150">
                </div>
            </fieldset>

            <fieldset style="border:none;padding:0;margin-top:12px">
                <legend style="font-weight:700; margin-bottom:8px">Datos del representante</legend>

                <div class="row">
                    <div class="field">
                        <label for="rep_nombre">Nombre del representante *</label>
                        <input id="rep_nombre" name="rep_nombre" type="text" required maxlength="100">
                    </div>
                    <div class="field">
                        <label for="rep_telefono">Teléfono *</label>
                        <input id="rep_telefono" name="rep_telefono" type="text" required pattern="[0-9 +-]{7,20}" maxlength="20" placeholder="Ej: 987654321">
                    </div>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="rep_email">Email</label>
                        <input id="rep_email" name="rep_email" type="email">
                    </div>
                    <div class="field">
                        <label for="fecha_inscripcion">Fecha de inscripción</label>
                        <input id="fecha_inscripcion" name="fecha_inscripcion" type="date">
                    </div>
                </div>
            </fieldset>

            <div class="actions">
                <button type="submit">Enviar matrícula</button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('matriculaForm');
        const message = document.getElementById('message');

        form.addEventListener('submit', function(e){
            e.preventDefault();
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // Aquí normalmente enviarías los datos al servidor via fetch/AJAX.
            // Para esta versión local mostramos un mensaje de éxito.
            message.className = 'success';
            message.textContent = 'Matrícula enviada correctamente (simulado).';
            message.style.display = 'block';

            // Opción: Se encarga de limpiar el formulario después de enviar.
            // form.reset();
        });
    </script>
</body>
</html>
